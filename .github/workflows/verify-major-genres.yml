name: Verify broad English genre previews

on:
  push:
    branches: [work/english-major-genres]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: major-genre-previews-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build every broad genre as a non-indexable preview
        run: node scripts/build-major-genres.mjs
      - name: Save verified static previews and report
        uses: actions/upload-artifact@v4
        with:
          name: english-major-genre-previews
          path: |
            dist-preview/
            release-manifests/major-genres-build.json
          retention-days: 14
