name: Sync complete Playgama portal catalog

on:
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portal-catalog-maintenance
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Fetch every official catalog page atomically
        run: npm run sync
      - name: Verify complete output before saving a catalog change
        run: npm run build
      - name: Check client behavior against the synchronized catalog
        run: npm run test:client
      - name: Save only validated catalog changes
        run: |
          git add data/portal/catalog.json data/portal/sync-state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync complete Playgama catalog'
          git push origin HEAD:${{ github.event.repository.default_branch }}
