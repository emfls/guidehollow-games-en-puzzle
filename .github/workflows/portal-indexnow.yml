name: Notify Naver of changed portal pages

on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portal-catalog-maintenance
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify the live deployment and notify only changed eligible URLs
        id: notify
        continue-on-error: true
        run: node scripts/notify-portal-indexnow.mjs
      - name: Save confirmed receipts only
        if: always()
        run: |
          git add data/portal/indexnow-receipt.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record confirmed Naver IndexNow receipts'
          git push origin HEAD:${{ github.event.repository.default_branch }}
